<style>
/* Turnos Barakaldo — інструмент: шахматка тиждень × ролі на десктопі, день-картка на телефоні; айдентика Limón Loco */
:root{
  --bg:#f7f8f2; --surface:#ffffff; --ink:#1d2419; --muted:#5b6553; --line:#e2e3d6; --line-strong:#c9ccb8;
  --leaf:#3e7a1e; --leaf-soft:#e9f2df; --on-leaf:#ffffff; --lemon:#f3d23b; --lemon-soft:#fbf3c9;
  --need:#b3261e; --need-bg:#fbe8e5; --boost:#5b6553; --boost-bg:#f1f2ea; --mine:#2453a6; --mine-bg:#e3ecfa;
  --warn:#8a5a00; --warn-bg:#fbefd3;
  --f-display:"Unbounded","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141812; --surface:#1d2219; --ink:#e8ecdf; --muted:#a3ad97; --line:#323a2b; --line-strong:#4a5440;
  --leaf:#8fca62; --leaf-soft:#243320; --on-leaf:#141812; --lemon:#e9c932; --lemon-soft:#3a3416;
  --need:#f29b8f; --need-bg:#3d201c; --boost:#a3ad97; --boost-bg:#242a20; --mine:#8fb2f0; --mine-bg:#1d2a44;
  --warn:#f0c060; --warn-bg:#3a2e14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141812; --surface:#1d2219; --ink:#e8ecdf; --muted:#a3ad97; --line:#323a2b; --line-strong:#4a5440;
  --leaf:#8fca62; --leaf-soft:#243320; --on-leaf:#141812; --lemon:#e9c932; --lemon-soft:#3a3416;
  --need:#f29b8f; --need-bg:#3d201c; --boost:#a3ad97; --boost-bg:#242a20; --mine:#8fb2f0; --mine-bg:#1d2a44;
  --warn:#f0c060; --warn-bg:#3a2e14; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:1240px;margin-inline:auto;display:grid;gap:22px;padding-block:24px 64px}
h1{font:700 clamp(22px,4vw,32px)/1.15 var(--f-display);margin:0;text-wrap:balance}
h2{font:500 17px/1.3 var(--f-display);margin:0}
.eyebrow{font:600 11px/1.4 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--leaf)}
.muted{color:var(--muted)} .mono{font-family:var(--f-mono)}
header{display:grid;gap:8px}
.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
label.ctl{display:flex;gap:8px;align-items:center;font-size:14px}
select,button,input{font:inherit;color:inherit}
select,input[type=number]{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:6px 10px;min-height:36px}
input[type=number]{width:84px}
button{cursor:pointer;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);padding:6px 12px;min-height:36px}
button:focus-visible,select:focus-visible,input:focus-visible,.slot:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
button.primary{background:var(--leaf);border-color:var(--leaf);color:var(--on-leaf);font-weight:600}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.note{font-size:13px;padding:8px 12px;border-radius:8px;background:var(--lemon-soft)}
.note.off{background:var(--warn-bg);color:var(--warn)}
/* підсумок людей */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;min-width:0}
.pc.me{border-color:var(--mine);box-shadow:inset 0 0 0 1px var(--mine)}
.pc .top{display:flex;justify-content:space-between;gap:4px 8px;align-items:baseline;flex-wrap:wrap}
.pc b{font-weight:600}
.pc .h{font:600 13px/1.2 var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--leaf);border-radius:4px}
.meter.over i{background:var(--need)}
.pc .sub{font-size:12px;color:var(--muted)}
.pc .x{font-size:12px;font-weight:600;color:var(--need)}
/* покриття */
.cov{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cov div{background:var(--surface);padding:10px 12px;display:grid;gap:2px}
.cov b{font:700 18px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.cov span{font-size:12.5px;color:var(--muted)}
/* шахматка */
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.grid{display:grid;grid-template-columns:112px repeat(7,minmax(132px,1fr));min-width:1040px}
.grid>div{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:8px;min-width:0}
.grid .dh{background:var(--bg);display:grid;gap:2px;position:relative}
.grid .dh b{font:600 13px/1.2 var(--f-body)}
.grid .dh .sub{font-size:11.5px;color:var(--muted);line-height:1.35}
.grid .dh.we{background:var(--leaf-soft)}
.grid .rh{background:var(--bg);font-size:12.5px;font-weight:600;display:grid;align-content:start;gap:2px}
.grid .rh span{font-weight:400;color:var(--muted);font-size:11px;line-height:1.3}
.cell{display:flex;flex-direction:column;gap:5px}
.slot{display:grid;gap:1px;text-align:left;padding:5px 7px;border-radius:7px;border:1.5px dashed var(--line-strong);background:transparent;min-height:0;font-size:12px;line-height:1.3;width:100%}
.slot .t{font:600 12px/1.2 var(--f-mono);font-variant-numeric:tabular-nums}
.slot .w{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot.need{border-color:var(--need);background:var(--need-bg)}
.slot.need .w{color:var(--need);font-weight:600}
.slot.boost{border-color:var(--line-strong);background:var(--boost-bg)}
.slot.taken{border-style:solid;border-color:var(--line-strong);background:var(--surface)}
.slot.taken .w{color:var(--ink);font-weight:600}
.slot.mine{border-style:solid;border-color:var(--mine);background:var(--mine-bg)}
.slot.mine .w{color:var(--mine)}
.slot.hide{display:none}
.empty{font-size:11.5px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px;border:1.5px dashed var(--line-strong)}
.legend .l-need{border-color:var(--need);background:var(--need-bg)} .legend .l-boost{background:var(--boost-bg)}
.legend .l-taken{border-style:solid;background:var(--surface)} .legend .l-mine{border-style:solid;border-color:var(--mine);background:var(--mine-bg)}
/* день на телефоні */
.day{display:none;gap:12px}
.dayhead{display:grid;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.roleblock{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px}
.roleblock h3{margin:0;font:600 14px/1.3 var(--f-body)}
.roleblock .cell{flex-direction:row;flex-wrap:wrap}
.roleblock .slot{width:auto;min-width:132px;font-size:13px;padding:8px 10px}
@media (max-width:760px){.gridwrap{display:none}.day{display:grid}}
/* діалог */
dialog{border:1px solid var(--line-strong);border-radius:14px;background:var(--surface);color:var(--ink);padding:18px;max-width:min(420px,calc(100vw - 32px));width:100%}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h3{margin:0 0 6px;font:600 16px/1.3 var(--f-display)}
dialog .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px}
dialog .warnbox{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:13.5px;margin-top:10px}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
details summary{cursor:pointer;font-weight:600}
details ul{margin:10px 0 0;padding-left:20px;display:grid;gap:6px;max-width:80ch;font-size:14px}
table.dec{border-collapse:collapse;font-size:14px;width:100%}
table.dec th,table.dec td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
table.dec td.n{text-align:right;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20}
@media (prefers-reduced-motion:no-preference){.slot{transition:background .15s,border-color .15s}}

.views{display:flex;gap:6px;flex-wrap:wrap}
.views button{font-weight:600}
.views button[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:var(--on-leaf)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) 96px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}

.cal .sh b{font:600 12px/1.2 var(--f-mono);font-variant-numeric:tabular-nums;display:block}

.empsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}

.headrow{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.lang button{font:600 12px/1 var(--f-mono);letter-spacing:.06em;min-height:32px;padding:6px 10px}
.dh .fest{font:600 11px/1.3 var(--f-body);color:var(--warn)}

.parks button{font-weight:600}

[hidden]{display:none!important}

.rulay{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px}

.rusec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px}

.pend{outline:2px dashed var(--leaf);outline-offset:-2px}.invf{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.invf input{min-height:36px;padding:4px 8px;min-width:240px}
#login{max-width:400px;margin:12vh auto 0;padding:24px 16px;display:grid;gap:14px}#login h1{margin:0}#login form{display:grid;gap:10px}#login input{min-height:46px;font-size:17px;padding:8px 12px;border-radius:8px;border:1px solid var(--line-strong);width:100%;box-sizing:border-box;background:var(--surface);color:var(--ink)}
.telsec{display:grid;gap:12px;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface)}.telhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}.telhead h2{margin:0}.telhead .muted{font-size:13px}
.telgrid{width:100%;border-collapse:collapse;font-size:13px}.telgrid th{font-weight:600;text-align:center;padding:4px;color:var(--muted);font-size:12px}.telgrid th:first-child{text-align:left}.telgrid td{padding:3px;border-top:1px solid var(--line);text-align:center;vertical-align:middle}.telgrid .telln{font-weight:600;text-align:left;white-space:nowrap;padding-right:8px}.telgrid .n{text-align:right;font-weight:600;white-space:nowrap}
.telc{display:block;width:100%;min-height:42px;border-radius:7px;padding:4px 2px;font-size:12px;line-height:1.3;border:0;box-sizing:border-box;font-family:inherit}.telok{background:var(--leaf-soft);color:var(--ink)}.telno{background:var(--warn-bg);color:var(--warn)}.telno0{color:var(--muted);background:transparent}button.telc{cursor:pointer}button.telc:hover{outline:2px solid var(--line-strong)}.telun{padding:12px 4px}.telunl{font-weight:400;font-size:11.5px;white-space:normal;max-width:96px;line-height:1.25}
.telsum{display:grid;gap:6px;font-size:14px}.telsumr{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.telsumr.muted{font-size:13px}.telrate{display:inline-flex;gap:6px;align-items:center;font-size:13px}.telrate input{width:64px;min-height:32px;padding:2px 6px}
#lg-code{letter-spacing:.35em;text-align:center;font-size:22px!important}#login button{min-height:44px}#lg-wait{text-align:center;margin-top:20vh}#login .links{display:flex;gap:10px;flex-wrap:wrap}
